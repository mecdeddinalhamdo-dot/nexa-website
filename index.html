<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Creative</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background:#0b0b14;
color:#fff;
}

/* NAVBAR */
nav{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:85%;
display:flex;
justify-content:space-between;
padding:15px 25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border-radius:20px;
border:1px solid rgba(255,255,255,0.1);
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#7c3aed33,#000);
}

.hero h1{
font-size:45px;
}

.hero p{
opacity:0.7;
}

/* PORTFOLIO */
.portfolio{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}

.portfolio img{
width:100%;
border-radius:15px;
transition:0.4s;
}

.portfolio img:hover{
transform:scale(1.05);
}

/* FLOAT BUTTONS */
.controls{
position:fixed;
bottom:20px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.btn{
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
background:#7c3aed;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
transform:scale(1.1);
}
</style>
</head>

<body>

<nav>
<div>NEXA</div>
<div>Agency</div>
</nav>

<section class="hero">
<h1>نصنع تجربة رقمية تبهر عملاءك</h1>
<p>تصميم • برمجة • تسويق</p>
</section>

<section class="portfolio">
<img src="1.jpg">
<img src="2.jpg">
<img src="3.jpg">
<img src="4.jpg">
<img src="5.jpg">
</section>

<div class="controls">
<div class="btn">🌙</div>
<a href="https://wa.me/905364391849" class="btn">
<i class="ri-whatsapp-line"></i>
</a>
<div class="btn">💬</div>
</div>

</body>
</html>
