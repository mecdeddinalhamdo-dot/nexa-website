<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Creative</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>
:root{
--bg:#ffffff;
--text:#111;
--accent:#7c3aed;
}

.dark{
--bg:#0b0b14;
--text:#fff;
}

body{
margin:0;
font-family:'Cairo';
background:var(--bg);
color:var(--text);
transition:0.4s;
}

/* LOADER */
.loader{
position:fixed;
width:100%;
height:100%;
background:#0b0b14;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}
.loader h1{
color:#7c3aed;
}

/* NAV */
nav{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:90%;
display:flex;
justify-content:space-between;
padding:15px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
border-radius:20px;
z-index:1000;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

/* FIX TEXT */
.title{
font-size:32px;
font-weight:bold;
letter-spacing:2px;
}

/* PORTFOLIO */
.portfolio{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
padding:20px;
}

.card img{
width:100%;
border-radius:15px;
}

/* BUTTONS */
.controls{
position:fixed;
bottom:20px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.btn{
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
border:none;
cursor:pointer;
font-size:20px;
}

.mode{background:#7c3aed;}
.whatsapp{background:#25D366;}

</style>
</head>

<body>

<!-- LOADER -->
<div class="loader" id="loader">
<h1>NEXA</h1>
</div>

<!-- NAV -->
<nav>
<div>NEXA</div>
<div>Creative Agency</div>
</nav>

<!-- HERO -->
<section class="hero">
<h1 class="title">NEXA Creative</h1>
<p class="reveal">تصميم • برمجة • تسويق</p>
</section>

<!-- PORTFOLIO -->
<section class="portfolio">
<div class="card"><img src="1.jpg"></div>
<div class="card"><img src="2.jpg"></div>
<div class="card"><img src="3.jpg"></div>
<div class="card"><img src="4.jpg"></div>
<div class="card"><img src="5.jpg"></div>
</section>

<!-- BUTTONS -->
<div class="controls">

<button id="modeBtn" class="btn mode">🌙</button>

<a href="https://wa.me/905364391849" target="_blank" class="btn whatsapp">
<i class="ri-whatsapp-line"></i>
</a>

</div>

<script>

/* LOADER */
window.addEventListener("load", ()=>{
document.getElementById("loader").style.display="none";
});

/* DARK MODE FIX */
const modeBtn = document.getElementById("modeBtn");

if(localStorage.getItem("mode")==="dark"){
document.body.classList.add("dark");
modeBtn.innerHTML="☀️";
}

modeBtn.onclick = () => {
document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){
localStorage.setItem("mode","dark");
modeBtn.innerHTML="☀️";
}else{
localStorage.setItem("mode","light");
modeBtn.innerHTML="🌙";
}
};

</script>

</body>
</html>
