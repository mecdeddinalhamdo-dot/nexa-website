<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Creative</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

<style>
:root{
--bg:#f8fafc;
--text:#111;
--accent:#7c3aed;
}

.dark{
--bg:#0b0b14;
--text:#fff;
}

body{
margin:0;
font-family:'Cairo',sans-serif;
background:var(--bg);
color:var(--text);
transition:0.4s;
overflow-x:hidden;
}

/* NAVBAR */
nav{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:90%;
display:flex;
justify-content:space-between;
padding:15px 25px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(15px);
border-radius:20px;
z-index:1000;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(120deg,#7c3aed22,#00000011);
}

.hero h1{
font-size:42px;
}

.typing{
border-right:3px solid;
white-space:nowrap;
overflow:hidden;
}

/* PORTFOLIO */
.portfolio{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}

.portfolio img{
width:100%;
border-radius:15px;
transition:0.4s;
}

.portfolio img:hover{
transform:scale(1.05);
}

/* BUTTONS */
.controls{
position:fixed;
bottom:20px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.btn{
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
background:#7c3aed;
cursor:pointer;
border:none;
}

/* WHATSAPP */
.whatsapp{
background:#25D366;
}
</style>
</head>

<body>

<nav>
<div>NEXA</div>
<div>Creative Agency</div>
</nav>

<section class="hero">
<h1 class="typing" id="typing"></h1>
<p>تصميم • برمجة • تسويق</p>
</section>

<section class="portfolio">
<img src="1.jpg">
<img src="2.jpg">
<img src="3.jpg">
<img src="4.jpg">
<img src="5.jpg">
</section>

<!-- FLOAT BUTTONS -->
<div class="controls">
<button id="modeBtn" class="btn" onclick="toggleMode()">🌙</button>

<a href="https://wa.me/905364391849" class="btn whatsapp">
<i class="ri-whatsapp-line"></i>
</a>

<button class="btn">💬</button>
</div>

<script>

/* حفظ الوضع */
let mode = localStorage.getItem("mode");

if(mode === "dark"){
document.body.classList.add("dark");
document.getElementById("modeBtn").innerHTML="☀️";
}else{
document.getElementById("modeBtn").innerHTML="🌙";
}

/* التبديل */
function toggleMode(){
document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){
localStorage.setItem("mode","dark");
document.getElementById("modeBtn").innerHTML="☀️";
}else{
localStorage.setItem("mode","light");
document.getElementById("modeBtn").innerHTML="🌙";
}
}

/* Typing Effect */
let text="نصنع تجربة رقمية تبهر عملاءك";
let i=0;

function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(type,40);
}
}
type();

</script>

</body>
</html>
