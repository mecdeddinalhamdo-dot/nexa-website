<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Agency</title>

<style>

/* ===== GLOBAL ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
scroll-behavior:smooth;
}

body{
background:#020617;
color:white;
transition:0.4s;
}

/* LIGHT MODE */
body.light{
background:#F8FAFC;
color:#0F172A;
}

/* ===== HEADER ===== */
header{
position:fixed;
width:100%;
top:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
background:rgba(2,6,23,0.7);
backdrop-filter:blur(10px);
z-index:999;
}

.logo img{
height:55px;
}

nav a{
margin:0 15px;
text-decoration:none;
color:white;
font-weight:500;
}

/* ===== HERO ===== */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0ea5e9,#020617);
}

.hero h1{
font-size:3.5rem;
}

.hero span{
color:#38BDF8;
}

.hero p{
margin-top:15px;
opacity:0.8;
}

.hero button{
margin-top:30px;
padding:12px 25px;
border:none;
border-radius:10px;
background:#38BDF8;
cursor:pointer;
}

/* ===== STATS ===== */
.stats{
display:flex;
justify-content:space-around;
padding:60px;
font-size:1.5rem;
}

/* ===== SERVICES ===== */
.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:60px;
}

.card{
padding:30px;
border-radius:15px;
background:#1E293B;
transition:0.4s;
opacity:0;
transform:translateY(50px);
}

.card:hover{
transform:translateY(-10px);
}

/* ===== PORTFOLIO ===== */
.portfolio{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:60px;
}

.work{
height:200px;
background:#334155;
border-radius:15px;
transition:0.4s;
}

.work:hover{
transform:scale(1.05);
}

/* ===== TESTIMONIALS ===== */
.testimonials{
padding:60px;
text-align:center;
}

.testimonials div{
margin:20px 0;
}

/* ===== FOOTER ===== */
footer{
text-align:center;
padding:20px;
background:#020617;
}

/* ===== WHATSAPP ===== */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50%;
color:white;
text-decoration:none;
}

/* ===== ANIMATION ===== */
.show{
opacity:1;
transform:translateY(0);
transition:0.6s;
}

</style>
</head>

<body>

<header>
<div class="logo">
<img src="/mnt/data/1002124847.jpg">
</div>

<nav>
<a href="#">الرئيسية</a>
<a href="#">الخدمات</a>
<a href="#">الأعمال</a>
<a href="#">تواصل</a>
</nav>

<button onclick="toggleMode()">🌙</button>
</header>

<section class="hero">
<h1>نصمم <span>هويتك</span> لتكون عالمية</h1>
<p>تصاميم احترافية ترفع مشروعك</p>
<button>ابدأ الآن</button>
</section>

<section class="stats">
<div>+100 عميل</div>
<div>+250 مشروع</div>
<div>5 سنوات خبرة</div>
</section>

<section class="services">
<div class="card">تصميم شعارات</div>
<div class="card">هوية بصرية</div>
<div class="card">سوشيال ميديا</div>
<div class="card">إعلانات</div>
</section>

<section class="portfolio">
<div class="work"></div>
<div class="work"></div>
<div class="work"></div>
</section>

<section class="testimonials">
<h2>آراء العملاء</h2>
<div>خدمة ممتازة 🔥</div>
<div>تصاميم احترافية جداً</div>
</section>

<footer>
<p>© NEXA 2026</p>
</footer>

<a class="whatsapp" href="https://wa.me/905364391849">💬</a>

<script>

/* DARK MODE */
function toggleMode(){
document.body.classList.toggle("light");
localStorage.setItem("mode",
document.body.classList.contains("light")?"light":"dark");
}

if(localStorage.getItem("mode")==="light"){
document.body.classList.add("light");
}

/* SCROLL ANIMATION */
const elements=document.querySelectorAll(".card,.work");

window.addEventListener("scroll",()=>{
elements.forEach(el=>{
let top=el.getBoundingClientRect().top;
if(top<window.innerHeight-100){
el.classList.add("show");
}
});
});

</script>

</body>
</html>
