<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA WOW</title>

<style>

/* ===== ROOT ===== */
:root{
--bg:#020617;
--text:#fff;
--accent:#38BDF8;
--glass:rgba(255,255,255,0.05);
}

body.light{
--bg:#fff;
--text:#111;
}

body{
margin:0;
font-family:system-ui;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
cursor:none;
}

/* ===== CUSTOM CURSOR ===== */
.cursor{
width:20px;
height:20px;
border:2px solid var(--accent);
border-radius:50%;
position:fixed;
pointer-events:none;
transform:translate(-50%,-50%);
transition:0.1s;
z-index:9999;
}

/* ===== HERO ===== */
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
position:relative;
}

.hero h1{
font-size:4rem;
animation:fadeUp 1s ease;
}

.hero span{
color:var(--accent);
}

.hero p{
margin-top:20px;
opacity:0.7;
animation:fadeUp 1.5s ease;
}

.hero button{
margin-top:30px;
padding:15px 35px;
border:none;
background:var(--accent);
border-radius:10px;
cursor:pointer;
}

.hero button:hover{
transform:scale(1.1);
box-shadow:0 20px 50px rgba(56,189,248,0.5);
}

/* ===== PARALLAX GLOW ===== */
.glow{
position:absolute;
width:500px;
height:500px;
background:radial-gradient(circle,var(--accent),transparent);
filter:blur(120px);
z-index:-1;
}

/* ===== SECTION ===== */
.section{
padding:120px 40px;
text-align:center;
}

.card{
margin:20px;
padding:30px;
display:inline-block;
background:var(--glass);
backdrop-filter:blur(10px);
border-radius:15px;
transition:0.4s;
opacity:0;
transform:translateY(50px);
}

.card.show{
opacity:1;
transform:translateY(0);
}

.card:hover{
transform:scale(1.05);
}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp{
from{opacity:0; transform:translateY(40px);}
to{opacity:1; transform:translateY(0);}
}

/* ===== WHATSAPP ===== */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50%;
color:white;
font-size:20px;
text-decoration:none;
}

/* ===== TOGGLE ===== */
.toggle{
position:fixed;
top:20px;
right:20px;
background:var(--glass);
padding:10px 15px;
border-radius:20px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="cursor"></div>

<div class="toggle" onclick="toggleMode()">🌙</div>

<section class="hero">
<div class="glow" id="glow"></div>

<h1>نصنع <span>تجربة بصرية</span> لا تُنسى</h1>
<p>تصاميم تخلي مشروعك يسبق الجميع</p>
<button>ابدأ الآن</button>
</section>

<section class="section">

<div class="card">تصميم شعارات فخم</div>
<div class="card">هوية بصرية كاملة</div>
<div class="card">تصميم سوشيال ميديا</div>

</section>

<a class="whatsapp" href="https://wa.me/905364391849">💬</a>

<script>

/* ===== CURSOR ===== */
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove",e=>{
cursor.style.top = e.clientY + "px";
cursor.style.left = e.clientX + "px";
});

/* ===== PARALLAX ===== */
document.addEventListener("mousemove",e=>{
let glow = document.getElementById("glow");
glow.style.transform = `translate(${e.clientX/20}px, ${e.clientY/20}px)`;
});

/* ===== DARK MODE ===== */
function toggleMode(){
document.body.classList.toggle("light");
}

/* ===== SCROLL ANIMATION ===== */
window.addEventListener("scroll",()=>{
document.querySelectorAll(".card").forEach(el=>{
if(el.getBoundingClientRect().top < window.innerHeight - 50){
el.classList.add("show");
}
});
});

</script>

</body>
</html>
