<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXA PRO</title>

<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>

:root{
--bg:#020617;
--text:#fff;
--card:#0f172a;
--accent:#38BDF8;
}

body.light{
--bg:#fff;
--text:#111;
--card:#f1f5f9;
}

body{
margin:0;
font-family:system-ui;
background:var(--bg);
color:var(--text);
}

/* ===== PROGRESS BAR ===== */
.progress{
position:fixed;
top:0;
left:0;
height:4px;
background:var(--accent);
width:0%;
z-index:9999;
}

/* ===== NAVBAR ===== */
header{
display:flex;
justify-content:space-between;
padding:20px 60px;
position:fixed;
width:100%;
background:rgba(0,0,0,0.3);
backdrop-filter:blur(12px);
}

/* ===== HERO ===== */
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.hero h1{
font-size:3.5rem;
}

.hero span{
color:var(--accent);
}

/* ===== BUTTON RIPPLE ===== */
.btn{
margin-top:25px;
padding:14px 30px;
background:var(--accent);
border:none;
border-radius:8px;
cursor:pointer;
position:relative;
overflow:hidden;
}

.btn::after{
content:"";
position:absolute;
width:0;
height:0;
background:rgba(255,255,255,0.4);
border-radius:50%;
transform:translate(-50%,-50%);
transition:0.5s;
}

.btn:active::after{
width:200px;
height:200px;
}

/* ===== SERVICES ===== */
.services{
padding:100px 60px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:30px;
}

.card{
padding:30px;
background:var(--card);
border-radius:15px;
text-align:center;
transition:0.4s;
}

.card i{
font-size:40px;
color:var(--accent);
margin-bottom:15px;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* ===== FEATURE SECTION ===== */
.features{
padding:100px 60px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:40px;
}

.feature{
display:flex;
gap:20px;
}

.feature i{
font-size:30px;
color:var(--accent);
}

/* ===== WHATSAPP ===== */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50%;
color:white;
font-size:22px;
text-decoration:none;
}

/* ===== TOGGLE ===== */
.toggle{
cursor:pointer;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
.services, .features{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<div class="progress" id="progress"></div>

<header>
<h2>NEXA</h2>

<div>
<i class="ri-moon-line toggle" onclick="toggleMode()"></i>
</div>
</header>

<section class="hero">
<h1>نصنع <span>تجربة رقمية</span> فريدة</h1>
<button class="btn">ابدأ الآن</button>
</section>

<section class="services">

<div class="card">
<i class="ri-brush-line"></i>
<h3>تصميم شعارات</h3>
<p>شعارات احترافية تعبر عن هويتك</p>
</div>

<div class="card">
<i class="ri-palette-line"></i>
<h3>هوية بصرية</h3>
<p>بناء هوية متكاملة لعلامتك</p>
</div>

<div class="card">
<i class="ri-instagram-line"></i>
<h3>سوشيال ميديا</h3>
<p>تصاميم جذابة تزيد التفاعل</p>
</div>

</section>
