<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Creative</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

<style>
:root{
    --bg:#0f0f1a;
    --card:#1a1a2e;
    --text:#fff;
    --accent:#7c3aed;
}

.light{
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#0f172a;
}

body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:0.4s;
}

/* NAV */
nav{
    display:flex;
    justify-content:space-between;
    padding:20px;
    backdrop-filter: blur(10px);
}

.logo{
    font-weight:bold;
    font-size:22px;
}

/* HERO */
.hero{
    text-align:center;
    padding:100px 20px;
    animation:fadeUp 1s ease;
}

.hero h1{
    font-size:40px;
}

/* PORTFOLIO */
.portfolio{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    padding:40px;
}

.card{
    position:relative;
    overflow:hidden;
    border-radius:20px;
    cursor:pointer;
}

.card img{
    width:100%;
    transition:0.5s;
}

.card:hover img{
    transform:scale(1.1);
}

/* LIGHTBOX */
.lightbox{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
