<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Creative</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>

:root{
--bg:#ffffff;
--text:#111;
--accent:#7c3aed;
}

.dark{
--bg:#0b0b14;
--text:#fff;
}

body{
margin:0;
font-family:'Cairo';
background:var(--bg);
color:var(--text);
transition:0.4s;
overflow-x:hidden;
}

/* LOADER */
.loader{
position:fixed;
width:100%;
height:100%;
background:#0b0b14;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}
.loader h1{
color:#7c3aed;
font-size:40px;
animation:pulse 1s infinite alternate;
}
@keyframes pulse{
from{opacity:0.5;}
to{opacity:1;}
}

/* NAV */
nav{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:90%;
display:flex;
justify-content:space-between;
padding:15px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
border-radius:20px;
z-index:1000;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:50px;
margin:0;
}

.hero p{
opacity:0.7;
}

/* PORTFOLIO */
.portfolio{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

.card{
overflow:hidden;
border-radius:20px;
position:relative;
}

.card img{
width:100%;
transition:0.5s;
}

.card:hover img{
transform:scale(1.1);
}

/* overlay */
.card::after{
content:"View Project";
position:absolute;
bottom:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.5);
color:#fff;
opacity:0;
transition:0.4s;
}

.card:hover::after{
opacity:1;
}

/* BUTTONS */
.controls{
position:fixed;
bottom:20px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.btn{
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
border:none;
cursor:pointer;
font-size:20px;
}

.mode{background:#7c3aed;}
.whatsapp{background:#25D366;}

</style>
</head>

<body>

<div class="loader" id="loader">
<h1>NEXA</h1>
</div>

<nav>
<div>NEXA</div>
<div>Creative Agency</div>
</nav>

<section class="hero">
<h1 class="hero-title">NEXA Creative</h1>
<p class="hero-sub">تصميم • برمجة • تسويق</p>
</section>

<section class="portfolio">
<div class="card reveal"><img src="1.jpg"></div>
<div class="card reveal"><img src="2.jpg"></div>
<div class="card reveal"><img src="3.jpg"></div>
<div class="card reveal"><img src="4.jpg"></div>
<div class="card reveal"><img src="5.jpg"></div>
</section>

<div class="controls">
<button id="modeBtn" class="btn mode">🌙</button>

<a href="https://wa.me/905364391849" target="_blank" class="btn whatsapp">
<i class="ri-whatsapp-line"></i>
</a>
</div>

<script>

/* LOADER */
window.addEventListener("load", ()=>{
document.getElementById("loader").style.display="none";
});

/* DARK MODE */
const modeBtn = document.getElementById("modeBtn");

if(localStorage.getItem("mode")==="dark"){
document.body.classList.add("dark");
modeBtn.innerHTML="☀️";
}

modeBtn.onclick = () => {
document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){
localStorage.setItem("mode","dark");
modeBtn.innerHTML="☀️";
}else{
localStorage.setItem("mode","light");
modeBtn.innerHTML="🌙";
}
};

/* GSAP ANIMATION */
gsap.registerPlugin(ScrollTrigger);

/* hero animation */
gsap.from(".hero-title",{y:50,opacity:0,duration:1});
gsap.from(".hero-sub",{y:30,opacity:0,duration:1,delay:0.3});

/* cards animation */
gsap.utils.toArray(".reveal").forEach((el)=>{
gsap.from(el,{
opacity:0,
y:60,
duration:1,
scrollTrigger:{
trigger:el,
start:"top 85%"
}
});
});

</script>

</body>
</html>
