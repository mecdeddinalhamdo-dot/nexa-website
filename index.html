<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Creative</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
:root{
    --bg:#0b0b14;
    --card:#151528;
    --text:#fff;
    --accent:#7c3aed;
}

.light{
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#111;
}

body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:0.4s;
}

/* NAV */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    backdrop-filter: blur(10px);
}

.logo img{
    height:40px;
}

/* HERO */
.hero{
    text-align:center;
    padding:120px 20px;
}

.hero h1{
    font-size:48px;
    margin-bottom:10px;
}

.hero p{
    opacity:0.7;
}

/* BUTTON */
.btn{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    background:var(--accent);
    color:#fff;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

/* PORTFOLIO */
.portfolio{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    padding:60px;
}

.card{
    overflow:hidden;
    border-radius:20px;
    cursor:pointer;
}

.card img{
    width:100%;
    transition:0.5s;
}

.card:hover img{
    transform:scale(1.1);
}

/* LIGHTBOX */
.lightbox{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    display:none;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
}

.lightbox img{
    max-width:80%;
}

/* WHATSAPP */
.whatsapp{
    position:fixed;
    bottom:20px;
    left:20px;
    background:#25D366;
    color:#fff;
    padding:15px;
    border-radius:50%;
    font-size:22px;
}

/* SCROLL ANIMATION */
.fade{
    opacity:0;
    transform:translateY(50px);
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">
<img src="logo.png">
</div>

<div>
<button class="btn" onclick="toggleMode()">🌙</button>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<h1 class="fade">NEXA Creative</h1>
<p class="fade">نحو تصميم يصنع التأثير الحقيقي</p>
<button class="btn fade">ابدأ مشروعك</button>
</section>

<!-- PORTFOLIO -->
<section class="portfolio">

<div class="card fade" onclick="openImg(this)">
<img src="1.jpg">
</div>

<div class="card fade" onclick="openImg(this)">
<img src="2.jpg">
</div>

<div class="card fade" onclick="openImg(this)">
<img src="3.jpg">
</div>

<div class="card fade" onclick="openImg(this)">
<img src="4.jpg">
</div>

<div class="card fade" onclick="openImg(this)">
<img src="5.jpg">
</div>

</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeImg()">
<img id="lightImg">
</div>

<!-- WHATSAPP -->
<a href="https://wa.me/905364391849" class="whatsapp">
<i class="ri-whatsapp-line"></i>
</a>

<script>
function toggleMode(){
    document.body.classList.toggle("light");
}

/* LIGHTBOX */
function openImg(el){
    document.getElementById("lightbox").style.display="flex";
    document.getElementById("lightImg").src = el.querySelector("img").src;
}

function closeImg(){
    document.getElementById("lightbox").style.display="none";
}

/* GSAP ANIMATION */
gsap.to(".fade", {
    opacity:1,
    y:0,
    duration:1,
    stagger:0.2
});
</script>

</body>
</html>
