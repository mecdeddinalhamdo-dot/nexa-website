<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Creative</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>
:root{
--bg:#f8fafc;
--text:#111;
--accent:#7c3aed;
}

.dark{
--bg:#0b0b14;
--text:#fff;
}

body{
margin:0;
font-family:'Cairo';
background:var(--bg);
color:var(--text);
transition:0.4s;
overflow-x:hidden;
}

/* LOADER */
.loader{
position:fixed;
width:100%;
height:100%;
background:#0b0b14;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}
.loader h1{
color:#7c3aed;
font-size:40px;
letter-spacing:5px;
}

/* NAVBAR */
nav{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:85%;
display:flex;
justify-content:space-between;
padding:15px 25px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(15px);
border-radius:20px;
z-index:1000;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#7c3aed22,#00000011);
}

.title span{
opacity:0;
display:inline-block;
transform:translateY(20px);
}

/* PORTFOLIO */
.portfolio{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}

.card{
overflow:hidden;
border-radius:20px;
}
.card img{
width:100%;
transition:0.5s;
}
.card:hover img{
transform:scale(1.1);
}

/* BUTTONS */
.controls{
position:fixed;
bottom:20px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.btn{
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
background:#7c3aed;
cursor:pointer;
border:none;
}

.whatsapp{background:#25D366;}

</style>
</head>

<body>

<!-- LOADER -->
<div class="loader" id="loader">
<h1>NEXA</h1>
</div>

<!-- NAV -->
<nav>
<div>NEXA</div>
<div>Creative Agency</div>
</nav>

<!-- HERO -->
<section class="hero">
<h1 class="title" id="title"></h1>
<p class="reveal">تصميم • برمجة • تسويق</p>
</section>

<!-- PORTFOLIO -->
<section class="portfolio">
<div class="card reveal"><img src="1.jpg"></div>
<div class="card reveal"><img src="2.jpg"></div>
<div class="card reveal"><img src="3.jpg"></div>
<div class="card reveal"><img src="4.jpg"></div>
<div class="card reveal"><img src="5.jpg"></div>
</section>

<!-- FLOAT BUTTONS -->
<div class="controls">
<button id="modeBtn" class="btn" onclick="toggleMode()">🌙</button>

<a href="https://wa.me/905364391849" class="btn whatsapp">
<i class="ri-whatsapp-line"></i>
</a>

</div>

<script>

/* LOADER */
window.addEventListener("load", () => {
gsap.to("#loader",{opacity:0,duration:1,onComplete:()=>{
document.getElementById("loader").style.display="none";
}});
});

/* DARK MODE */
let mode = localStorage.getItem("mode");

if(mode==="dark"){
document.body.classList.add("dark");
modeBtn.innerHTML="☀️";
}else{
modeBtn.innerHTML="🌙";
}

function toggleMode(){
document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){
localStorage.setItem("mode","dark");
modeBtn.innerHTML="☀️";
}else{
localStorage.setItem("mode","light");
modeBtn.innerHTML="🌙";
}
}

/* TEXT REVEAL */
let text="NEXA Creative";
let title=document.getElementById("title");

title.innerHTML=text.split("").map(l=>`<span>${l}</span>`).join("");

gsap.to(".title span",{y:0,opacity:1,stagger:0.05,duration:0.8});

/* SCROLL ANIMATION */
gsap.utils.toArray(".reveal").forEach(el=>{
gsap.from(el,{
scrollTrigger:{trigger:el,start:"top 85%"},
y:60,
opacity:0,
duration:1
});
});

</script>

</body>
</html>
