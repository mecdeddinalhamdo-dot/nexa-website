<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Agency</title>

<style>

/* ===== GLOBAL ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', sans-serif;
scroll-behavior:smooth;
}

body{
background:linear-gradient(135deg,#0F172A,#020617);
color:white;
transition:0.4s;
}

/* LIGHT MODE */
body.light{
background:#F8FAFC;
color:#0F172A;
}

/* ===== HEADER ===== */
header{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
backdrop-filter:blur(15px);
background:rgba(15,23,42,0.6);
z-index:999;
}

.logo img{
height:55px;
}

nav a{
margin:0 15px;
text-decoration:none;
color:white;
font-weight:500;
position:relative;
}

nav a::after{
content:'';
position:absolute;
bottom:-5px;
left:0;
width:0%;
height:2px;
background:#38BDF8;
transition:0.3s;
}

nav a:hover::after{
width:100%;
}

/* ===== BUTTON ===== */
.toggle{
background:#38BDF8;
border:none;
padding:8px 15px;
border-radius:8px;
cursor:pointer;
}

/* ===== HERO ===== */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:3.5rem;
background:linear-gradient(90deg,#38BDF8,#818CF8);
-webkit-background-clip:text;
color:transparent;
animation:fadeUp 1s ease;
}

/* TEXT TYPING */
.typing{
margin-top:10px;
font-size:1.2rem;
opacity:0.8;
border-right:2px solid;
white-space:nowrap;
overflow:hidden;
width:0;
animation:typing 4s steps(40,end) forwards, blink 0.8s infinite;
}

/* BUTTON */
.hero button{
margin-top:30px;
padding:12px 25px;
border:none;
border-radius:10px;
background:#38BDF8;
cursor:pointer;
transition:0.3s;
}

.hero button:hover{
transform:scale(1.1);
box-shadow:0 0 20px #38BDF8;
}

/* ===== SERVICES ===== */
.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:80px 50px;
}

.card{
padding:30px;
border-radius:20px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
transition:0.4s;
opacity:0;
transform:translateY(50px);
}

.card:hover{
transform:translateY(-15px) scale(1.03);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* ===== WHATSAPP ===== */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px 18px;
border-radius:50%;
font-size:22px;
text-decoration:none;
box-shadow:0 0 15px rgba(0,0,0,0.5);
transition:0.3s;
}

.whatsapp:hover{
transform:scale(1.1);
}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp{
from{opacity:0; transform:translateY(40px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes typing{
to{width:260px;}
}

@keyframes blink{
50%{border-color:transparent;}
}

.show{
opacity:1;
transform:translateY(0);
}

</style>
</head>

<body>

<header>
<div class="logo">
<img src="/mnt/data/1002124847.jpg">
</div>

<nav>
<a href="#">الرئيسية</a>
<a href="#">الخدمات</a>
<a href="#">الأعمال</a>
<a href="#">تواصل</a>
</nav>

<button class="toggle" onclick="toggleMode()">🌙</button>
</header>

<section class="hero">
<h1>NEXA DESIGN</h1>
<div class="typing">نصمم لك هوية تبهر العالم</div>
<button>ابدأ الآن</button>
</section>

<section class="services">

<div class="card">تصميم شعارات احترافية</div>
<div class="card">هوية بصرية كاملة</div>
<div class="card">تصميم سوشيال ميديا</div>
<div class="card">إعلانات وتسويق بصري</div>

</section>

<!-- WhatsApp Button -->
<a class="whatsapp" href="https://wa.me/905364391849" target="_blank">💬</a>

<script>

/* DARK MODE SAVE */
function toggleMode(){
document.body.classList.toggle("light");
localStorage.setItem("mode",
document.body.classList.contains("light") ? "light" : "dark");
}

if(localStorage.getItem("mode") === "light"){
document.body.classList.add("light");
}

/* SCROLL ANIMATION */
const cards = document.querySelectorAll(".card");

window.addEventListener("scroll", ()=>{
cards.forEach(card=>{
let top = card.getBoundingClientRect().top;
if(top < window.innerHeight - 100){
card.classList.add("show");
}
});
});

</script>

</body>
</html>
